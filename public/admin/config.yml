backend:
  name: github
  repo: geobtaa/geobtaa.github.io
  branch: main
  base_url: https://decap-auth.geobtaa.workers.dev
  auth_endpoint: /auth
  squash_merges: true

publish_mode: editorial_workflow
local_backend: true

site_url: https://gin.btaa.org
media_folder: "src/assets/images"
public_folder: "@images"
editor:
  preview: false

collections:
  - name: "about"
    label: "About"
    folder: "src/content/docs/about"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/docs/posts"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"

      - label: "Authors"
        name: "authors"
        widget: "list"
        label_singular: "author"
        collapsed: true
        summary: "{{fields.name}}"
        fields:
          - label: "Name"
            name: "name"
            widget: "string"

      - label: "Cover"
        name: "cover"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Cover Image"
            name: "image"
            widget: "image"
            choose_url: true
            required: false
          - label: "Alt Text"
            name: "alt"
            widget: "string"
            hint: "Describe the image for people using screen readers."
            required: true

      - label: "Tags"
        name: "tags"
        widget: "list"

      - label: "Publication Date"
        name: "date"
        widget: "datetime"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["rich_text", "raw"]
        hint: "Use Rich Text for standard writing. Switch to Raw before editing imports or custom MDX components."
        editor_components: []

  - name: "conference"
    label: "Conference"
    folder: "src/content/docs/conference"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "guides"
    label: "Guides"
    folder: "src/content/docs/guides"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "library"
    label: "Library Docs"
    folder: "src/content/docs/library"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Year"
        name: "year"
        widget: "number"

      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - label: "Reports"
            value: "reports"
          - label: "Program Guidelines"
            value: "program guidelines"
          - label: "Proposals"
            value: "proposals"
          - label: "Best Practices"
            value: "best practices"
          - label: "Charters"
            value: "charters"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "projects"
    label: "Projects"
    folder: "src/content/docs/projects"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "scholarship"
    label: "Scholarship"
    folder: "src/content/docs/scholarship"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "team"
    label: "Team"
    folder: "src/content/docs/team"
    extension: "mdx"
    format: "frontmatter"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "description"
        widget: "text"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        editor_components: []

  - name: "updates"
    label: "Program Updates"
    extension: "mdx"
    folder: "src/content/docs/updates"
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Short Summary"
        name: "excerpt"
        widget: "text"
        hint: "A brief description used in update listings and search results."

      - label: "Authors"
        name: "authors"
        widget: "list"
        label_singular: "author"
        collapsed: true
        summary: "{{fields.name}}"
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
        default:
          - name: "BTAA-GIN Staff"

      - label: "Optional Cover Image"
        name: "cover"
        widget: "object"
        collapsed: true
        required: false
        fields:
          - label: "Cover Image"
            name: "image"
            widget: "image"
            choose_url: true
            required: false
          - label: "Alt Text"
            name: "alt"
            widget: "string"
            hint: "Describe the image for people using screen readers."
            required: true

      - label: "Tags"
        name: "tags"
        widget: "list"
        default:
          - "Program Updates"

      - label: "Publication Date"
        name: "date"
        widget: "datetime"

      - label: "Hide from site"
        name: "draft"
        widget: "boolean"
        required: false
        default: false
        hint: "If checked, this content stays hidden from the public site even when the workflow status is Published."

      - label: "Update Content"
        name: "programUpdate"
        widget: "object"
        required: true
        collapsed: false
        fields:
          - label: "1. Monthly Highlight"
            name: "highlight"
            widget: "object"
            required: true
            collapsed: false
            hint: "Lead with the most important story or announcement from this month."
            fields:
              - label: "Section Title"
                name: "title"
                widget: "string"
                required: true
                default: "Monthly Highlight"
              - label: "Summary"
                name: "intro"
                widget: "richtext"
                required: true
                modes: ["rich_text"]
                buttons:
                  - "bold"
                  - "italic"
                  - "link"
                  - "bulleted-list"
                  - "numbered-list"
                editor_components: []
                hint: "Write and format the highlight summary here. Use the toolbar for emphasis, links, and lists."
              - label: "Link Text"
                name: "linkText"
                widget: "string"
                required: false
              - label: "Link URL"
                name: "linkUrl"
                widget: "string"
                required: false
              - label: "Image"
                name: "image"
                widget: "image"
                choose_url: true
                required: false
              - label: "Image Alt Text"
                name: "imageAlt"
                widget: "string"
                required: false
              - label: "Image Caption"
                name: "imageCaption"
                widget: "string"
                required: false

          - label: "2. Committee Updates"
            name: "committees"
            widget: "object"
            required: true
            collapsed: false
            hint: "Add a short item for each committee activity."
            fields:
              - label: "TECHnology Committee"
                name: "technology"
                widget: "richtext"
                required: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []
              - label: "Community Engagement Committee"
                name: "communityEngagement"
                widget: "richtext"
                required: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []
              - label: "Knowledge Committee"
                name: "knowledge"
                widget: "richtext"
                required: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []
              - label: "Coordination Committee"
                name: "coordination"
                widget: "richtext"
                required: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []

          - label: "3. Workgroup Updates"
            name: "workgroups"
            widget: "list"
            required: true
            label_singular: "workgroup"
            collapsed: false
            summary: "{{fields.name}}"
            hint: "Create one group for each active workgroup, then add its updates."
            fields:
              - label: "Workgroup Name"
                name: "name"
                widget: "string"
              - label: "Updates"
                name: "updates"
                widget: "richtext"
                required: false
                modes: ["rich_text"]
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []

          - label: "4. Geoportal Activity"
            name: "geoportal"
            widget: "object"
            required: true
            collapsed: false
            hint: "Add the monthly chart, usage metrics, searches, and collection total."
            fields:
              - label: "Monthly Stats Chart Image"
                name: "chartImage"
                widget: "image"
                choose_url: true
                required: false
              - label: "Monthly Stats Chart Alt Text"
                name: "chartAlt"
                widget: "string"
                required: false
              - label: "Monthly Stats Chart Caption"
                name: "chartCaption"
                widget: "string"
                required: false
              - label: "Metrics"
                name: "metrics"
                widget: "list"
                required: true
                label_singular: "metric"
                collapsed: false
                summary: "{{fields.label}}: {{fields.value}}"
                hint: "The standard monthly metrics are prefilled. Enter each value; add or rename rows only when needed."
                default:
                  - label: "Visitors"
                    value: ""
                  - label: "Downloads"
                    value: ""
                  - label: "Searches"
                    value: ""
                  - label: "Pageviews"
                    value: ""
                fields:
                  - label: "Label"
                    name: "label"
                    widget: "string"
                  - label: "Value"
                    name: "value"
                    widget: "string"
              - label: "Top Google Searches (comma-separated)"
                name: "topGoogleSearches"
                widget: "list"
                required: true
                separator: ","
                hint: "Enter search terms separated by commas."
              - label: "Top Internal Search Keywords (comma-separated)"
                name: "topInternalSearches"
                widget: "list"
                required: true
                separator: ","
                hint: "Enter keywords separated by commas."
              - label: "Collections Total Records Date Label"
                name: "recordsTotalAsOf"
                widget: "string"
                required: true
                hint: "Example: January 2026"
              - label: "Collections Total Records Value"
                name: "recordsTotalValue"
                widget: "string"
                required: true
          - label: "5. Web Development Updates"
            name: "webDevelopment"
            widget: "object"
            required: true
            collapsed: false
            hint: "Summarize notable website and application development work."
            fields:
              - label: "Updates"
                name: "updates"
                widget: "richtext"
                required: true
                modes: ["rich_text"]
                buttons: ["bold", "italic", "link", "bulleted-list", "numbered-list"]
                editor_components: []
              - label: "More Details URL"
                name: "moreDetailsUrl"
                widget: "string"
                required: false
              - label: "More Details Link Label"
                name: "moreDetailsLabel"
                widget: "string"
                required: false

      - label: "Generated Body"
        name: "body"
        widget: "hidden"
        required: false
        default: |
          import ProgramUpdateStructured from 'src/components/ProgramUpdateStructured.astro';

          <ProgramUpdateStructured data={frontmatter.programUpdate} />
