<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- Retry a publish when a just-saved editorial-workflow branch has a newer head. -->
    <script src="/admin/github-publish-retry.js"></script>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script>
      (function () {
        function getAdminView(hash) {
          if (/^#\/collections\/[^/]+$/.test(hash)) return "collection-list";
          if (/^#\/collections\/[^/]+\/(entries\/.+|new)$/.test(hash)) return "entry-editor";
          return "default";
        }

        function getCollectionName(hash) {
          const match = (hash || "").match(/^#\/collections\/([^/]+)/);
          return match ? match[1] : "";
        }

        function syncAdminViewClass() {
          document.body.dataset.adminView = getAdminView(window.location.hash || "");
        }

        let listViewObserver = null;
        let forcedListHash = "";
        let editorViewObserver = null;
        let editorUiFrame = 0;


        const standardEntryMetadata = {
          about: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          conference: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          guides: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          projects: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          scholarship: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          team: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          library: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Year", key: "year", column: "side" },
            { label: "Tags", key: "tags", column: "side" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          blog: [
            { label: "Title", key: "title", column: "main" },
            { label: "Excerpt", key: "summary", column: "main" },
            { label: "Authors", key: "authors", column: "main", style: "compound" },
            { label: "Cover", key: "cover", column: "main", style: "compound" },
            { label: "Tags", key: "tags", column: "side" },
            { label: "Publication Date", key: "date", column: "side", style: "compound" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
        };

        function stopListViewObserver() {
          if (!listViewObserver) return;
          listViewObserver.disconnect();
          listViewObserver = null;
        }

        function stopEditorViewObserver() {
          if (editorViewObserver) {
            editorViewObserver.disconnect();
            editorViewObserver = null;
          }

          if (editorUiFrame) {
            window.cancelAnimationFrame(editorUiFrame);
            editorUiFrame = 0;
          }
        }

        function normalizedText(element) {
          return (element && element.textContent ? element.textContent : "")
            .replace(/\s+/g, " ")
            .trim()
            .toLocaleLowerCase();
        }

        function findEditorLabel(text) {
          const expected = text.toLocaleLowerCase();
          const candidates = document.querySelectorAll(
            '#nc-root label, #nc-root [class*="FieldLabel"], #nc-root [class*="ObjectControlLabel"], #nc-root [class*="ListControlLabel"]',
          );

          return (
            Array.from(candidates).find((candidate) => normalizedText(candidate) === expected) ||
            Array.from(candidates).find((candidate) =>
              normalizedText(candidate).startsWith(`${expected} `),
            )
          );
        }

        function findControlContainer(label) {
          if (!(label instanceof HTMLElement)) return null;
          return label.closest('[class*="ControlContainer"]');
        }

        function clearStandardEntryEditor() {
          document.getElementById("entry-meta-heading")?.remove();
          document.getElementById("entry-body-heading")?.remove();

          document.querySelectorAll("[data-entry-meta]").forEach((element) => {
            delete element.dataset.entryMeta;
            delete element.dataset.entryMetaColumn;
            delete element.dataset.entryMetaStyle;
          });
          document
            .querySelectorAll("[data-entry-meta-label]")
            .forEach((element) => delete element.dataset.entryMetaLabel);
          document
            .querySelectorAll("[data-entry-meta-boundary]")
            .forEach((element) => delete element.dataset.entryMetaBoundary);
          document
            .querySelectorAll("[data-entry-optional-marker]")
            .forEach((element) => {
              delete element.dataset.entryOptionalMarker;
              element.removeAttribute("aria-hidden");
            });
          document
            .querySelectorAll("[data-entry-fields]")
            .forEach((element) => delete element.dataset.entryFields);
          document
            .querySelectorAll("[data-entry-body]")
            .forEach((element) => delete element.dataset.entryBody);
          document
            .querySelectorAll("[data-entry-body-label]")
            .forEach((element) => delete element.dataset.entryBodyLabel);
        }

        function initStandardEntryEditor() {
          const collection = getCollectionName(window.location.hash || "");
          const metadataFields = standardEntryMetadata[collection];
          if (!metadataFields) return true;

          clearStandardEntryEditor();

          const bodyLabel = findEditorLabel("Body");
          const bodyControl = findControlContainer(bodyLabel);
          if (!(bodyControl instanceof HTMLElement)) return false;

          let firstControl = null;
          let fieldsContainer = null;
          let ready = true;

          metadataFields.forEach(
            ({ label: labelText, key, column = "main", style = "standard" }) => {
              const label = findEditorLabel(labelText);
              const control = findControlContainer(label);
              if (!(label instanceof HTMLElement) || !(control instanceof HTMLElement)) {
                ready = false;
                return;
              }

              if (!firstControl) {
                firstControl = control;
                fieldsContainer = control.parentElement;
              }

              control.dataset.entryMeta = key;
              control.dataset.entryMetaColumn = column;
              control.dataset.entryMetaStyle = style;
              label.dataset.entryMetaLabel = "true";

              if (key === "visibility") {
                label.querySelectorAll("span, small").forEach((element) => {
                  if (["optional", "(optional)"].includes(normalizedText(element))) {
                    element.dataset.entryOptionalMarker = "true";
                    element.setAttribute("aria-hidden", "true");
                  }
                });
              }

              if (label instanceof HTMLLabelElement) {
                const widgetBoundary = document.getElementById(label.htmlFor);
                if (widgetBoundary instanceof HTMLElement) {
                  widgetBoundary.dataset.entryMetaBoundary = key;
                }
              }
            },
          );

          if (!ready || !(firstControl instanceof HTMLElement) || !(fieldsContainer instanceof HTMLElement)) {
            return false;
          }

          fieldsContainer.dataset.entryFields = "true";
          bodyControl.dataset.entryBody = "true";
          if (bodyLabel instanceof HTMLElement) bodyLabel.dataset.entryBodyLabel = "true";

          if (!document.getElementById("entry-meta-heading")) {
            const heading = document.createElement("div");
            heading.id = "entry-meta-heading";
            heading.innerHTML =
              "<strong>Page details</strong><span>Title, publishing information, and display settings</span>";
            firstControl.before(heading);
          }

          if (!document.getElementById("entry-body-heading")) {
            const heading = document.createElement("div");
            heading.id = "entry-body-heading";
            heading.textContent = "Page content";
            bodyControl.before(heading);
          }

          return true;
        }

        function scheduleStandardEntryEditor() {
          if (editorUiFrame) return;
          editorUiFrame = window.requestAnimationFrame(() => {
            editorUiFrame = 0;
            const collection = getCollectionName(window.location.hash || "");
            if (collection === "updates") return;

            const initialized = initStandardEntryEditor();
            if (initialized && editorViewObserver) {
              editorViewObserver.disconnect();
              editorViewObserver = null;
            }
          });
        }

        function watchStandardEntryEditor() {
          stopEditorViewObserver();

          const hash = window.location.hash || "";
          if (
            getAdminView(hash) !== "entry-editor" ||
            getCollectionName(hash) === "updates"
          ) {
            return;
          }

          scheduleStandardEntryEditor();
          editorViewObserver = new MutationObserver(scheduleStandardEntryEditor);
          editorViewObserver.observe(document.getElementById("nc-root") || document.body, {
            childList: true,
            subtree: true,
          });
        }

        function forceListView() {
          const hash = window.location.hash || "";
          if (getAdminView(hash) !== "collection-list") return true;

          const listButton = document.querySelector('button[aria-label="List view option"]');
          if (!(listButton instanceof HTMLButtonElement)) return false;

          if (forcedListHash !== hash) {
            listButton.click();
            forcedListHash = hash;
          }

          return true;
        }

        function watchForListViewControls() {
          stopListViewObserver();

          if (forceListView()) return;

          listViewObserver = new MutationObserver(() => {
            if (forceListView()) {
              stopListViewObserver();
            }
          });

          listViewObserver.observe(document.body, { childList: true, subtree: true });

          window.setTimeout(stopListViewObserver, 4000);
        }

        function syncAdminUi() {
          const hash = window.location.hash || "";
          syncAdminViewClass();
          document.body.dataset.adminCollection = getCollectionName(hash);

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(watchForListViewControls);
          });

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(initCustomSortControl);
          });

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(watchStandardEntryEditor);
          });
        }

        syncAdminUi();
        window.addEventListener("hashchange", syncAdminUi);

        function parseEntryDate(href) {
          const match = (href || "").match(/\/entries\/(\d{4})-(\d{2})(?:-(\d{2}))?/);
          if (!match) return 0;

          const year = Number(match[1]);
          const month = Number(match[2]) - 1;
          const day = match[3] ? Number(match[3]) : 1;
          return Date.UTC(year, month, day);
        }

        function sortUpdateCards(sortBy) {
          const cardsGrid =
            document.querySelector(".css-1y2l20x-CardsGrid") ||
            document.querySelector('[class*="CardsGrid"]');

          if (!(cardsGrid instanceof HTMLElement)) return;

          const cards = Array.from(cardsGrid.children);
          cards.sort((a, b) => {
            const aLink = a.querySelector('a[href]');
            const bLink = b.querySelector('a[href]');
            const aTitle = a.textContent.trim().toLocaleLowerCase();
            const bTitle = b.textContent.trim().toLocaleLowerCase();

            if (sortBy === "title") {
              return aTitle.localeCompare(bTitle);
            }

            const aDate = parseEntryDate(aLink && "href" in aLink ? aLink.getAttribute("href") : "");
            const bDate = parseEntryDate(bLink && "href" in bLink ? bLink.getAttribute("href") : "");

            return bDate - aDate || aTitle.localeCompare(bTitle);
          });

          cards.forEach((card) => cardsGrid.appendChild(card));
        }

        function initCustomSortControl() {
          const hash = window.location.hash || "";
          const isUpdatesListView =
            getAdminView(hash) === "collection-list" && getCollectionName(hash) === "updates";

          const existingControl = document.getElementById("custom-updates-sort");

          if (!isUpdatesListView) {
            if (existingControl) existingControl.remove();
            return;
          }

          const controlsContainer =
            document.querySelector(".css-uopcpt-CollectionControlsContainer") ||
            document.querySelector('[class*="CollectionControlsContainer"]');

          if (!(controlsContainer instanceof HTMLElement)) return;

          const nativeSortWrapper = Array.from(controlsContainer.children).find((element) =>
            element.textContent && element.textContent.includes("Sort by"),
          );

          if (nativeSortWrapper instanceof HTMLElement) {
            nativeSortWrapper.setAttribute("hidden", "hidden");
            nativeSortWrapper.setAttribute("aria-hidden", "true");
          }

          if (existingControl instanceof HTMLElement) {
            sortUpdateCards(existingControl.value || "updated");
            return;
          }

          const wrapper = document.createElement("label");
          wrapper.id = "custom-updates-sort-wrapper";
          wrapper.className = "custom-updates-sort";
          wrapper.textContent = "Sort by";

          const select = document.createElement("select");
          select.id = "custom-updates-sort";
          select.setAttribute("aria-label", "Sort Program Updates");

          const updatedOption = document.createElement("option");
          updatedOption.value = "updated";
          updatedOption.textContent = "Updated On";

          const titleOption = document.createElement("option");
          titleOption.value = "title";
          titleOption.textContent = "Title";

          select.append(updatedOption, titleOption);
          select.value = "updated";
          select.addEventListener("change", () => {
            sortUpdateCards(select.value);
          });

          wrapper.appendChild(select);
          controlsContainer.appendChild(wrapper);
          sortUpdateCards("updated");
        }

        if (!window.CMS || typeof window.CMS.registerEventListener !== "function") return;

        const escapedComponentTagPattern =
          /&lt;\/?[A-Z][A-Za-z0-9._:-]*(?:\s+[^&<>]*)?&gt;/;

        const programUpdateBody = `import ProgramUpdateStructured from 'src/components/ProgramUpdateStructured.astro';

<ProgramUpdateStructured data={frontmatter.programUpdate} />`;

        function validateMdxBody(body) {
          const errors = [];
          const lines = body.split(/\r?\n/);
          let inCodeFence = false;
          let openAdmonitions = 0;
          let escapedComponentFound = false;

          for (const rawLine of lines) {
            const line = rawLine.trim();

            if (/^```/.test(line)) {
              inCodeFence = !inCodeFence;
              continue;
            }

            if (inCodeFence) continue;

            if (line === ":::") {
              if (openAdmonitions === 0) {
                errors.push('Found a closing ":::" without a matching opening admonition.');
              } else {
                openAdmonitions -= 1;
              }
              continue;
            }

            if (line.startsWith(":::")) {
              openAdmonitions += 1;
            }

            if (!escapedComponentFound && escapedComponentTagPattern.test(line)) {
              escapedComponentFound = true;
            }
          }

          if (inCodeFence) {
            errors.push('Unclosed triple-backtick code fence ("```").');
          }

          if (openAdmonitions > 0) {
            errors.push('Unclosed admonition fence (":::").');
          }

          if (escapedComponentFound) {
            errors.push(
              "Escaped MDX component tag detected (for example: &lt;Card&gt;). Keep component tags unescaped in source mode.",
            );
          }

          return errors;
        }

        CMS.registerEventListener({
          name: "preSave",
          handler: ({ entry }) => {
            const data = entry.get("data");
            if (!data || typeof data.get !== "function") return data;

            const body = data.get("body");
            const programUpdate = data.get("programUpdate");

            // Decap occasionally omits a markdown default while recreating a draft.
            // Keep the field optional in the form, but always write the renderer that
            // turns the structured fields into the published Program Update page.
            if (programUpdate && (typeof body !== "string" || body.trim().length === 0)) {
              return data.set("body", programUpdateBody);
            }

            if (typeof body !== "string" || body.length === 0) return data;

            const errors = validateMdxBody(body);
            if (errors.length) {
              throw new Error(`Please fix the following before saving:\n- ${errors.join("\n- ")}`);
            }

            return data;
          },
        });
      })();
    </script>
  </body>
</html>
