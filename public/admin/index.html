<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <!-- Retry a publish when a just-saved editorial-workflow branch has a newer head. -->
    <script src="/admin/github-publish-retry.js"></script>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script>
      (function () {
        function getAdminView(hash) {
          if (/^#\/collections\/[^/]+$/.test(hash)) return "collection-list";
          if (/^#\/collections\/[^/]+\/(entries\/.+|new)$/.test(hash)) return "entry-editor";
          return "default";
        }

        function getCollectionName(hash) {
          const match = (hash || "").match(/^#\/collections\/([^/]+)/);
          return match ? match[1] : "";
        }

        function syncAdminViewClass() {
          document.body.dataset.adminView = getAdminView(window.location.hash || "");
        }

        let listViewObserver = null;
        let forcedListHash = "";
        let editorViewObserver = null;
        let editorUiFrame = 0;

        const programUpdateSections = [
          { label: "1. Monthly Highlight", shortLabel: "Highlight", key: "highlight" },
          { label: "2. Committee Updates", shortLabel: "Committees", key: "committees" },
          { label: "3. Workgroup Updates", shortLabel: "Workgroups", key: "workgroups" },
          { label: "4. Geoportal Activity", shortLabel: "Geoportal", key: "geoportal" },
          {
            label: "5. Web Development Updates",
            shortLabel: "Web Development",
            key: "web-development",
          },
        ];

        const standardEntryMetadata = {
          about: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          conference: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          guides: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          projects: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          scholarship: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          team: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          library: [
            { label: "Title", key: "title", column: "main" },
            { label: "Description", key: "description", column: "main" },
            { label: "Year", key: "year", column: "side" },
            { label: "Tags", key: "tags", column: "side" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
          blog: [
            { label: "Title", key: "title", column: "main" },
            { label: "Excerpt", key: "summary", column: "main" },
            { label: "Authors", key: "authors", column: "main", style: "compound" },
            { label: "Cover", key: "cover", column: "main", style: "compound" },
            { label: "Tags", key: "tags", column: "side" },
            { label: "Publication Date", key: "date", column: "side", style: "compound" },
            { label: "Hide from site", key: "visibility", column: "side", style: "compact" },
          ],
        };

        function stopListViewObserver() {
          if (!listViewObserver) return;
          listViewObserver.disconnect();
          listViewObserver = null;
        }

        function stopEditorViewObserver() {
          if (editorViewObserver) {
            editorViewObserver.disconnect();
            editorViewObserver = null;
          }

          if (editorUiFrame) {
            window.cancelAnimationFrame(editorUiFrame);
            editorUiFrame = 0;
          }
        }

        function normalizedText(element) {
          return (element && element.textContent ? element.textContent : "")
            .replace(/\s+/g, " ")
            .trim()
            .toLocaleLowerCase();
        }

        function findEditorLabel(text) {
          const expected = text.toLocaleLowerCase();
          const candidates = document.querySelectorAll(
            '#nc-root label, #nc-root [class*="FieldLabel"], #nc-root [class*="ObjectControlLabel"], #nc-root [class*="ListControlLabel"]',
          );

          return (
            Array.from(candidates).find((candidate) => normalizedText(candidate) === expected) ||
            Array.from(candidates).find((candidate) =>
              normalizedText(candidate).startsWith(`${expected} `),
            )
          );
        }

        function findControlContainer(label) {
          if (!(label instanceof HTMLElement)) return null;
          return label.closest('[class*="ControlContainer"]');
        }

        function clearStandardEntryEditor() {
          document.getElementById("entry-meta-heading")?.remove();
          document.getElementById("entry-body-heading")?.remove();

          document.querySelectorAll("[data-entry-meta]").forEach((element) => {
            delete element.dataset.entryMeta;
            delete element.dataset.entryMetaColumn;
            delete element.dataset.entryMetaStyle;
          });
          document
            .querySelectorAll("[data-entry-meta-label]")
            .forEach((element) => delete element.dataset.entryMetaLabel);
          document
            .querySelectorAll("[data-entry-meta-boundary]")
            .forEach((element) => delete element.dataset.entryMetaBoundary);
          document
            .querySelectorAll("[data-entry-optional-marker]")
            .forEach((element) => {
              delete element.dataset.entryOptionalMarker;
              element.removeAttribute("aria-hidden");
            });
          document
            .querySelectorAll("[data-entry-fields]")
            .forEach((element) => delete element.dataset.entryFields);
          document
            .querySelectorAll("[data-entry-body]")
            .forEach((element) => delete element.dataset.entryBody);
          document
            .querySelectorAll("[data-entry-body-label]")
            .forEach((element) => delete element.dataset.entryBodyLabel);
        }

        function initStandardEntryEditor() {
          const collection = getCollectionName(window.location.hash || "");
          const metadataFields = standardEntryMetadata[collection];
          if (!metadataFields) return true;

          document.getElementById("program-update-section-nav")?.remove();
          clearStandardEntryEditor();

          const bodyLabel = findEditorLabel("Body");
          const bodyControl = findControlContainer(bodyLabel);
          if (!(bodyControl instanceof HTMLElement)) return false;

          let firstControl = null;
          let fieldsContainer = null;
          let ready = true;

          metadataFields.forEach(
            ({ label: labelText, key, column = "main", style = "standard" }) => {
              const label = findEditorLabel(labelText);
              const control = findControlContainer(label);
              if (!(label instanceof HTMLElement) || !(control instanceof HTMLElement)) {
                ready = false;
                return;
              }

              if (!firstControl) {
                firstControl = control;
                fieldsContainer = control.parentElement;
              }

              control.dataset.entryMeta = key;
              control.dataset.entryMetaColumn = column;
              control.dataset.entryMetaStyle = style;
              label.dataset.entryMetaLabel = "true";

              if (key === "visibility") {
                label.querySelectorAll("span, small").forEach((element) => {
                  if (["optional", "(optional)"].includes(normalizedText(element))) {
                    element.dataset.entryOptionalMarker = "true";
                    element.setAttribute("aria-hidden", "true");
                  }
                });
              }

              if (label instanceof HTMLLabelElement) {
                const widgetBoundary = document.getElementById(label.htmlFor);
                if (widgetBoundary instanceof HTMLElement) {
                  widgetBoundary.dataset.entryMetaBoundary = key;
                }
              }
            },
          );

          if (!ready || !(firstControl instanceof HTMLElement) || !(fieldsContainer instanceof HTMLElement)) {
            return false;
          }

          fieldsContainer.dataset.entryFields = "true";
          bodyControl.dataset.entryBody = "true";
          if (bodyLabel instanceof HTMLElement) bodyLabel.dataset.entryBodyLabel = "true";

          if (!document.getElementById("entry-meta-heading")) {
            const heading = document.createElement("div");
            heading.id = "entry-meta-heading";
            heading.innerHTML =
              "<strong>Page details</strong><span>Title, publishing information, and display settings</span>";
            firstControl.before(heading);
          }

          if (!document.getElementById("entry-body-heading")) {
            const heading = document.createElement("div");
            heading.id = "entry-body-heading";
            heading.textContent = "Page content";
            bodyControl.before(heading);
          }

          return true;
        }

        function flattenObjectWidget(label, boundaryKind) {
          if (!(label instanceof HTMLLabelElement)) return false;

          const widgetBoundary = document.getElementById(label.htmlFor);
          if (!(widgetBoundary instanceof HTMLElement)) return false;

          const objectToolbar = widgetBoundary.firstElementChild;
          if (!(objectToolbar instanceof HTMLElement)) return false;

          const toggle = objectToolbar.querySelector('button[data-testid="expand-button"]');
          if (toggle instanceof HTMLButtonElement) {
            const action = (toggle.getAttribute("aria-label") || "").toLocaleLowerCase();
            if (action.includes("expand")) toggle.click();
            toggle.dataset.programUpdateFixedToggle = boundaryKind;
          }

          widgetBoundary.dataset.programUpdateBoundary = boundaryKind;
          objectToolbar.dataset.programUpdateObjectToolbar = boundaryKind;
          return true;
        }

        function initProgramUpdateMetadata(rootControl) {
          const fieldsContainer = rootControl.parentElement;
          if (!(fieldsContainer instanceof HTMLElement)) return;

          fieldsContainer.dataset.programUpdateFields = "true";
          const metadataFields = [
            { label: "Title", key: "title" },
            { label: "Short Summary", key: "summary" },
            { label: "Authors", key: "authors", style: "compound" },
            { label: "Optional Cover Image", key: "cover", style: "compound" },
            { label: "Tags", key: "tags" },
            { label: "Publication Date", key: "date", style: "compound" },
            { label: "Hide from site", key: "visibility", style: "compact" },
          ];

          let firstControl = null;
          const controls = new Map();
          metadataFields.forEach(({ label: labelText, key, style = "standard" }) => {
            const label = findEditorLabel(labelText);
            const control = findControlContainer(label);
            if (!(label instanceof HTMLElement) || !(control instanceof HTMLElement)) return;

            control.dataset.programUpdateMeta = key;
            control.dataset.programUpdateMetaStyle = style;
            label.dataset.programUpdateMetaLabel = "true";
            controls.set(key, control);
            if (!firstControl) firstControl = control;

            if (key === "visibility") {
              label.querySelectorAll("span, small").forEach((element) => {
                if (["optional", "(optional)"].includes(normalizedText(element))) {
                  element.dataset.programUpdateOptionalMarker = "true";
                  element.setAttribute("aria-hidden", "true");
                }
              });
            }

            if (label instanceof HTMLLabelElement) {
              const widgetBoundary = document.getElementById(label.htmlFor);
              if (widgetBoundary instanceof HTMLElement) {
                widgetBoundary.dataset.programUpdateMetaBoundary = key;
              }
            }
          });

          const dateControl = controls.get("date");
          const visibilityControl = controls.get("visibility");
          if (
            dateControl instanceof HTMLElement &&
            visibilityControl instanceof HTMLElement &&
            !document.querySelector('[data-program-update-publishing="true"]')
          ) {
            const publishingGroup = document.createElement("div");
            publishingGroup.dataset.programUpdatePublishing = "true";
            publishingGroup.setAttribute("role", "group");
            publishingGroup.setAttribute("aria-label", "Publishing settings");
            dateControl.before(publishingGroup);
            publishingGroup.append(dateControl, visibilityControl);
          }

          if (!firstControl || document.getElementById("program-update-meta-heading")) return;

          const heading = document.createElement("div");
          heading.id = "program-update-meta-heading";
          heading.innerHTML =
            "<strong>Page details</strong><span>Title, publishing information, and optional display settings</span>";
          firstControl.before(heading);
        }

        function buildProgramUpdateNav(rootControl) {
          const existingNav = document.getElementById("program-update-section-nav");
          if (existingNav) return;

          const nav = document.createElement("nav");
          nav.id = "program-update-section-nav";
          nav.setAttribute("aria-label", "Program Update sections");

          const navLabel = document.createElement("strong");
          navLabel.textContent = "Jump to section";
          nav.appendChild(navLabel);

          const links = document.createElement("div");
          links.className = "program-update-section-links";

          programUpdateSections.forEach((section) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = section.shortLabel;
            button.addEventListener("click", () => {
              const target = document.querySelector(
                `[data-program-update-section="${section.key}"]`,
              );
              if (target instanceof HTMLElement) {
                target.scrollIntoView({ behavior: "smooth", block: "start" });
                const firstInput = target.querySelector(
                  'input:not([type="hidden"]), textarea, [contenteditable="true"]',
                );
                if (firstInput instanceof HTMLElement) firstInput.focus({ preventScroll: true });
              }
            });
            links.appendChild(button);
          });

          nav.appendChild(links);
          rootControl.before(nav);
        }

        function initProgramUpdateMetrics() {
          const metricsLabel = findEditorLabel("Metrics");
          const metricsControl = findControlContainer(metricsLabel);
          if (!(metricsLabel instanceof HTMLLabelElement) || !(metricsControl instanceof HTMLElement)) {
            return;
          }

          metricsControl.dataset.programUpdateMetrics = "true";
          metricsLabel.dataset.programUpdateMetricsLabel = "true";

          const listBoundary = document.getElementById(metricsLabel.htmlFor);
          if (listBoundary instanceof HTMLElement) {
            listBoundary.dataset.programUpdateMetricsList = "true";
            const listToolbar = listBoundary.firstElementChild;
            if (listToolbar instanceof HTMLElement) {
              listToolbar.dataset.programUpdateMetricsToolbar = "true";
            }
          }

          metricsControl
            .querySelectorAll(
              '[data-testid^="styled-list-item-top-bar-"], [class*="StyledListItemTopBar"]',
            )
            .forEach((toolbar) => {
              if (!(toolbar instanceof HTMLElement) || !(toolbar.parentElement instanceof HTMLElement)) {
                return;
              }

              const row = toolbar.parentElement;
              row.dataset.programUpdateMetricRow = "true";
              toolbar.dataset.programUpdateMetricRowToolbar = "true";

              const toggle = toolbar.querySelector(
                'button[data-testid="expand-button"], button:first-of-type',
              );
              if (toggle instanceof HTMLButtonElement) {
                const action = (toggle.getAttribute("aria-label") || "").toLocaleLowerCase();
                if (action.includes("expand") || !row.querySelector('input[id^="label-field-"]')) {
                  toggle.click();
                }
                toggle.dataset.programUpdateMetricToggle = "true";
              }

              const summary = row.querySelector('[class*="NestedObjectLabel"]');
              if (summary instanceof HTMLElement) {
                summary.dataset.programUpdateMetricSummary = "true";
              }

              const fieldControls = new Map();
              row
                .querySelectorAll('label, [class*="FieldLabel"]')
                .forEach((fieldLabel) => {
                  const key = normalizedText(fieldLabel);
                  if (key !== "label" && key !== "value") return;
                  const fieldControl = findControlContainer(fieldLabel);
                  if (!(fieldControl instanceof HTMLElement)) return;
                  fieldControl.dataset.programUpdateMetricCell = key;
                  fieldControls.set(key, fieldControl);
                });

              const labelControl = fieldControls.get("label");
              const valueControl = fieldControls.get("value");
              if (!(labelControl instanceof HTMLElement) || !(valueControl instanceof HTMLElement)) return;

              [labelControl, valueControl].forEach((fieldControl) => {
                let wrapper = fieldControl.parentElement;
                while (wrapper && wrapper !== row) {
                  wrapper.dataset.programUpdateMetricFields = "true";
                  wrapper = wrapper.parentElement;
                }
              });
            });
        }

        function findEditorLabelWithin(root, text) {
          if (!(root instanceof HTMLElement)) return null;
          const expected = text.toLocaleLowerCase();
          const candidates = root.querySelectorAll(
            'label, [class*="FieldLabel"], [class*="ObjectControlLabel"], [class*="ListControlLabel"]',
          );

          return (
            Array.from(candidates).find((candidate) => normalizedText(candidate) === expected) ||
            Array.from(candidates).find((candidate) =>
              normalizedText(candidate).startsWith(`${expected} `),
            ) ||
            null
          );
        }

        function groupProgramUpdateFields(sectionKey, groupKey, labelTexts) {
          const section = document.querySelector(`[data-program-update-section="${sectionKey}"]`);
          if (!(section instanceof HTMLElement)) return;

          const controls = labelTexts.map((labelText) => {
            const label = findEditorLabelWithin(section, labelText);
            const control = findControlContainer(label);
            if (!(label instanceof HTMLElement) || !(control instanceof HTMLElement)) return null;

            control.dataset.programUpdateCompactField = "true";
            label.dataset.programUpdateCompactLabel = "true";
            label.querySelectorAll("span, small").forEach((element) => {
              if (["optional", "(optional)"].includes(normalizedText(element))) {
                element.dataset.programUpdateOptionalMarker = "true";
                element.setAttribute("aria-hidden", "true");
              }
            });
            return control;
          });

          if (controls.some((control) => !(control instanceof HTMLElement))) return;
          const fieldControls = controls.filter((control) => control instanceof HTMLElement);
          const existingGroup = section.querySelector(
            `[data-program-update-compact-group="${groupKey}"]`,
          );
          if (existingGroup instanceof HTMLElement) return;

          const parent = fieldControls[0].parentElement;
          if (
            !(parent instanceof HTMLElement) ||
            !fieldControls.every((control) => control.parentElement === parent)
          ) {
            return;
          }

          const group = document.createElement("div");
          group.dataset.programUpdateCompactGroup = groupKey;
          fieldControls[0].before(group);
          group.append(...fieldControls);
        }

        function initProgramUpdateCompactFields() {
          groupProgramUpdateFields("highlight", "highlight-link", ["Link Text", "Link URL"]);
          groupProgramUpdateFields("highlight", "highlight-image-details", [
            "Image Alt Text",
            "Image Caption",
          ]);
          groupProgramUpdateFields("geoportal", "chart-image-details", [
            "Monthly Stats Chart Alt Text",
            "Monthly Stats Chart Caption",
          ]);
          groupProgramUpdateFields("geoportal", "searches", [
            "Top Google Searches (comma-separated)",
            "Top Internal Search Keywords (comma-separated)",
          ]);
          groupProgramUpdateFields("geoportal", "records-total", [
            "Collections Total Records Date Label",
            "Collections Total Records Value",
          ]);
          groupProgramUpdateFields("web-development", "more-details", [
            "More Details URL",
            "More Details Link Label",
          ]);
        }

        function initProgramUpdateEditor() {
          const hash = window.location.hash || "";
          const isUpdateEditor =
            getAdminView(hash) === "entry-editor" && getCollectionName(hash) === "updates";

          if (!isUpdateEditor) {
            const nav = document.getElementById("program-update-section-nav");
            if (nav) nav.remove();
            return true;
          }

          clearStandardEntryEditor();

          const rootLabel = findEditorLabel("Update Content");
          const rootControl = findControlContainer(rootLabel);
          if (!(rootControl instanceof HTMLElement)) return false;

          rootControl.dataset.programUpdateRoot = "true";
          rootLabel.dataset.programUpdateRootLabel = "true";
          const rootReady = flattenObjectWidget(rootLabel, "root");

          const sectionsReady = programUpdateSections.every((section) => {
            const label = findEditorLabel(section.label);
            const control = findControlContainer(label);
            if (!(control instanceof HTMLElement)) return false;

            control.dataset.programUpdateSection = section.key;
            label.dataset.programUpdateSectionLabel = "true";
            const boundaryKind = section.key === "workgroups" ? "list-section" : "section";
            return flattenObjectWidget(label, boundaryKind);
          });

          initProgramUpdateMetadata(rootControl);
          initProgramUpdateMetrics();
          initProgramUpdateCompactFields();
          buildProgramUpdateNav(rootControl);
          return rootReady && sectionsReady;
        }

        function scheduleProgramUpdateEditor() {
          if (editorUiFrame) return;
          editorUiFrame = window.requestAnimationFrame(() => {
            editorUiFrame = 0;
            const collection = getCollectionName(window.location.hash || "");
            const initialized =
              collection === "updates" ? initProgramUpdateEditor() : initStandardEntryEditor();
            if (initialized && editorViewObserver) {
              editorViewObserver.disconnect();
              editorViewObserver = null;
            }
          });
        }

        function watchProgramUpdateEditor() {
          stopEditorViewObserver();

          const hash = window.location.hash || "";
          if (getAdminView(hash) !== "entry-editor") return;

          scheduleProgramUpdateEditor();
          editorViewObserver = new MutationObserver(scheduleProgramUpdateEditor);
          editorViewObserver.observe(document.getElementById("nc-root") || document.body, {
            childList: true,
            subtree: true,
          });
        }

        function forceListView() {
          const hash = window.location.hash || "";
          if (getAdminView(hash) !== "collection-list") return true;

          const listButton = document.querySelector('button[aria-label="List view option"]');
          if (!(listButton instanceof HTMLButtonElement)) return false;

          if (forcedListHash !== hash) {
            listButton.click();
            forcedListHash = hash;
          }

          return true;
        }

        function watchForListViewControls() {
          stopListViewObserver();

          if (forceListView()) return;

          listViewObserver = new MutationObserver(() => {
            if (forceListView()) {
              stopListViewObserver();
            }
          });

          listViewObserver.observe(document.body, { childList: true, subtree: true });

          window.setTimeout(stopListViewObserver, 4000);
        }

        function syncAdminUi() {
          const hash = window.location.hash || "";
          syncAdminViewClass();
          document.body.dataset.adminCollection = getCollectionName(hash);

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(watchForListViewControls);
          });

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(initCustomSortControl);
          });

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(watchProgramUpdateEditor);
          });
        }

        syncAdminUi();
        window.addEventListener("hashchange", syncAdminUi);
        document.addEventListener("click", (event) => {
          if (!(event.target instanceof Element) || !event.target.closest("button")) return;
          if (
            getAdminView(window.location.hash || "") !== "entry-editor" ||
            getCollectionName(window.location.hash || "") !== "updates"
          ) {
            return;
          }

          window.requestAnimationFrame(() => {
            window.requestAnimationFrame(initProgramUpdateEditor);
          });
        });

        function parseEntryDate(href) {
          const match = (href || "").match(/\/entries\/(\d{4})-(\d{2})(?:-(\d{2}))?/);
          if (!match) return 0;

          const year = Number(match[1]);
          const month = Number(match[2]) - 1;
          const day = match[3] ? Number(match[3]) : 1;
          return Date.UTC(year, month, day);
        }

        function sortUpdateCards(sortBy) {
          const cardsGrid =
            document.querySelector(".css-1y2l20x-CardsGrid") ||
            document.querySelector('[class*="CardsGrid"]');

          if (!(cardsGrid instanceof HTMLElement)) return;

          const cards = Array.from(cardsGrid.children);
          cards.sort((a, b) => {
            const aLink = a.querySelector('a[href]');
            const bLink = b.querySelector('a[href]');
            const aTitle = a.textContent.trim().toLocaleLowerCase();
            const bTitle = b.textContent.trim().toLocaleLowerCase();

            if (sortBy === "title") {
              return aTitle.localeCompare(bTitle);
            }

            const aDate = parseEntryDate(aLink && "href" in aLink ? aLink.getAttribute("href") : "");
            const bDate = parseEntryDate(bLink && "href" in bLink ? bLink.getAttribute("href") : "");

            return bDate - aDate || aTitle.localeCompare(bTitle);
          });

          cards.forEach((card) => cardsGrid.appendChild(card));
        }

        function initCustomSortControl() {
          const hash = window.location.hash || "";
          const isUpdatesListView =
            getAdminView(hash) === "collection-list" && getCollectionName(hash) === "updates";

          const existingControl = document.getElementById("custom-updates-sort");

          if (!isUpdatesListView) {
            if (existingControl) existingControl.remove();
            return;
          }

          const controlsContainer =
            document.querySelector(".css-uopcpt-CollectionControlsContainer") ||
            document.querySelector('[class*="CollectionControlsContainer"]');

          if (!(controlsContainer instanceof HTMLElement)) return;

          const nativeSortWrapper = Array.from(controlsContainer.children).find((element) =>
            element.textContent && element.textContent.includes("Sort by"),
          );

          if (nativeSortWrapper instanceof HTMLElement) {
            nativeSortWrapper.setAttribute("hidden", "hidden");
            nativeSortWrapper.setAttribute("aria-hidden", "true");
          }

          if (existingControl instanceof HTMLElement) {
            sortUpdateCards(existingControl.value || "updated");
            return;
          }

          const wrapper = document.createElement("label");
          wrapper.id = "custom-updates-sort-wrapper";
          wrapper.className = "custom-updates-sort";
          wrapper.textContent = "Sort by";

          const select = document.createElement("select");
          select.id = "custom-updates-sort";
          select.setAttribute("aria-label", "Sort Program Updates");

          const updatedOption = document.createElement("option");
          updatedOption.value = "updated";
          updatedOption.textContent = "Updated On";

          const titleOption = document.createElement("option");
          titleOption.value = "title";
          titleOption.textContent = "Title";

          select.append(updatedOption, titleOption);
          select.value = "updated";
          select.addEventListener("change", () => {
            sortUpdateCards(select.value);
          });

          wrapper.appendChild(select);
          controlsContainer.appendChild(wrapper);
          sortUpdateCards("updated");
        }

        if (!window.CMS || typeof window.CMS.registerEventListener !== "function") return;

        const escapedComponentTagPattern =
          /&lt;\/?[A-Z][A-Za-z0-9._:-]*(?:\s+[^&<>]*)?&gt;/;

        const programUpdateBody = `import ProgramUpdateStructured from 'src/components/ProgramUpdateStructured.astro';

<ProgramUpdateStructured data={frontmatter.programUpdate} />`;

        function validateMdxBody(body) {
          const errors = [];
          const lines = body.split(/\r?\n/);
          let inCodeFence = false;
          let openAdmonitions = 0;
          let escapedComponentFound = false;

          for (const rawLine of lines) {
            const line = rawLine.trim();

            if (/^```/.test(line)) {
              inCodeFence = !inCodeFence;
              continue;
            }

            if (inCodeFence) continue;

            if (line === ":::") {
              if (openAdmonitions === 0) {
                errors.push('Found a closing ":::" without a matching opening admonition.');
              } else {
                openAdmonitions -= 1;
              }
              continue;
            }

            if (line.startsWith(":::")) {
              openAdmonitions += 1;
            }

            if (!escapedComponentFound && escapedComponentTagPattern.test(line)) {
              escapedComponentFound = true;
            }
          }

          if (inCodeFence) {
            errors.push('Unclosed triple-backtick code fence ("```").');
          }

          if (openAdmonitions > 0) {
            errors.push('Unclosed admonition fence (":::").');
          }

          if (escapedComponentFound) {
            errors.push(
              "Escaped MDX component tag detected (for example: &lt;Card&gt;). Keep component tags unescaped in source mode.",
            );
          }

          return errors;
        }

        CMS.registerEventListener({
          name: "preSave",
          handler: ({ entry }) => {
            const data = entry.get("data");
            if (!data || typeof data.get !== "function") return data;

            const body = data.get("body");
            const programUpdate = data.get("programUpdate");

            // Decap occasionally omits a markdown default while recreating a draft.
            // Keep the field optional in the form, but always write the renderer that
            // turns the structured fields into the published Program Update page.
            if (programUpdate && (typeof body !== "string" || body.trim().length === 0)) {
              return data.set("body", programUpdateBody);
            }

            if (typeof body !== "string" || body.length === 0) return data;

            const errors = validateMdxBody(body);
            if (errors.length) {
              throw new Error(`Please fix the following before saving:\n- ${errors.join("\n- ")}`);
            }

            return data;
          },
        });
      })();
    </script>
  </body>
</html>
